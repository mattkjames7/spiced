name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Install project
        run: cmake --install build --prefix "$RUNNER_TEMP/spiced-install"

      - name: Configure package consumer example
        run: >-
          cmake -S examples/package-consumer
          -B examples/package-consumer/build
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/spiced-install"

      - name: Build package consumer example
        run: cmake --build examples/package-consumer/build --parallel

      - name: Run package consumer example
        run: ./examples/package-consumer/build/spiced_package_example